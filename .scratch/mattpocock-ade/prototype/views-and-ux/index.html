<div id="root" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
<div id="bar"><button id="prev">&lsaquo;</button><span id="vlabel"></span><button id="next">&rsaquo;</button></div>
<div id="tip"></div>
<script src="data.js"></script><script src="scenarios.js"></script>
<script>
// ================= data (REAL snapshot + optional simulation) =================
const MAPS=REAL.maps;
const T=REAL.tickets.map(t=>({...t,sim:false}));
const SIMT=[
 {id:"x1",map:"m1",title:"Packaging, auto-update and distribution",type:"grilling",status:"open",blocked:[],gist:"(simulated: graduated from fog)",sim:true},
 {id:"x2",map:"m1",title:"Testing strategy for rule engine and adapters",type:"grilling",status:"open",blocked:[],gist:"(simulated: graduated from fog)",sim:true},
 {id:"x3",map:"m1",title:"Settings and non-default skill setups",type:"grilling",status:"open",blocked:["11"],gist:"(simulated: graduated from fog)",sim:true}];
let simOn=false;const allT=()=>simOn?T.concat(SIMT):T;
const WT={main:{branch:REAL.branch,files:REAL.files,commits:REAL.commits}};
const SESS=REAL.sessions;SESS.forEach(s=>{const w=REAL.wt&&REAL.wt[s.id];WT[s.id]=w?{...w,newWt:true}:WT.main});
const AGENTS=["GitHub Copilot","Claude Code","Codex CLI","Gemini CLI","OpenCode"];
const REPO=REAL.project;
// ================= state =================
let tabs=[{k:"ticket",i:"11"},{k:"map",i:"m1"},{k:"session",i:"6502aa71"}],act=0;
let leftSel="tickets",rightSel="files",evMode="full",menuOpen=null,modal=null,msg="",agentSel="GitHub Copilot",legendOpen=true;
const collapsed={},mapCollapsed={},dirState={},acc={files:true,git:true,sess:true};
let leftHidden=false,rightHidden=false;
// ================= helpers =================
const byId=id=>allT().find(t=>t.id===id),mapOf=id=>MAPS.find(m=>m.id===id);
const sessT=id=>SESS.find(s=>s.ticket===id&&s.state!=="ended")||SESS.filter(s=>s.ticket===id).at(-1);
const sessM=id=>SESS.filter(s=>s.map===id).at(-1);
const live=()=>SESS.filter(s=>s.state!=="ended");
const blocked=t=>t.blocked.some(b=>byId(b).status!=="resolved");
const frontier=m=>allT().filter(t=>t.map===m&&t.status==="open"&&!blocked(t)&&!(sessT(t.id)&&sessT(t.id).state!=="ended"));
function nextSet(){const s=new Set();MAPS.forEach(m=>{const f=frontier(m.id);if(f.length)s.add(f[0].id);else if(m.fog.length)s.add("map:"+m.id)});return s}
const cmdT=t=>`/wayfinder continue on ${mapOf(t.map).title} map`;
const cmdM=m=>`/wayfinder continue on ${m.title} map`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tip=s=>` data-tip="${String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/\n/g,"&#10;")}"`;
const SVG=(p,c,extra="")=>`<svg class="si ${extra}" viewBox="0 0 12 12" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SPATH={
 working:[`<path d="M6 1.5a4.5 4.5 0 1 1-4.5 4.5"/>`,"#6fa8dc","spin"],
 waiting:[`<path d="M1.5 2h9v6h-5l-2.5 2.2V8h-1.5z"/>`,"#d6b36a",""],
 idle:[`<path d="M2.5 6h7"/>`,"#8a8a8a",""],
 ended:[`<rect x="3" y="3" width="6" height="6" rx="1"/>`,"#707070",""]};
const STXT={working:"working",waiting:"waiting for you",idle:"idle",ended:"ended (read-only transcript)"};
const AG={"Claude Code":["#d97757",`<path d="M7 1.5v11M1.5 7h11M3.1 3.1l7.8 7.8M10.9 3.1 3.1 10.9"/>`],
 "GitHub Copilot":["#b8c0cc",`<rect x="2" y="4" width="10" height="7.5" rx="3"/><path d="M5 7.5v1M9 7.5v1M7 4V2"/>`],
 "Codex CLI":["#74aa9c",`<path d="M7 1.5l4.8 2.75v5.5L7 12.5 2.2 9.75v-5.5z"/><path d="M5.3 6l1.6 1-1.6 1"/>`],
 "Gemini CLI":["#7fa3f5",`<path d="M7 1.5C7.4 5 9 6.6 12.5 7 9 7.4 7.4 9 7 12.5 6.6 9 5 7.4 1.5 7 5 6.6 6.6 5 7 1.5z"/>`],
 "OpenCode":["#9a9a9a",`<path d="M4.5 2.5h-2v9h2M9.5 2.5h2v9h-2"/>`]};
const aSvg=a=>{const [c,p]=AG[a]||AG.OpenCode;return `<svg class="ai" viewBox="0 0 14 14" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`};
function sIcon(s){const [p,c,x]=SPATH[s.state];return `<span class="ic ag ${s.state==="ended"?"off":""}"${tip(s.agent+" "+STXT[s.state])}>${aSvg(s.agent)}${SVG(p,c,"so "+x)}</span>`}
const FOG=`<svg class="si" viewBox="0 0 12 12" fill="none" stroke="#7f93a8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1.7 1.3"><path d="M3.5 9.5h5a2 2 0 0 0 .3-4 3 3 0 0 0-5.7.8 1.7 1.7 0 0 0 .4 3.2z"/></svg>`;
const fogIc=`<span class="ic"${tip("Fog: decision not yet specified")}>${FOG}</span>`;
// two independent axes: CATS = static kind (from the Matt Pocock workflow), STS = ticket status (the icon)
const CATS=[["fog","Fog","decisions not yet specified, no ticket yet","#7f93a8"],["planning","Planning","grilling, research and prototype tickets","#c792ea"],["impl","Implementation","tickets that build the thing","#82c07a"]];
const STS=[["active","In progress","a session has claimed it","#d6b36a"],["ready","Ready","startable","#7fbf7a"],["blocked","Blocked","waits for an unresolved ticket","#d98a7a"],["done","Done","resolved","#5b7a66"]];
const axOf=t=>t.type==="task"?"impl":"planning";
const stOf=t=>t.status==="resolved"?"done":t.status==="claimed"?"active":(blocked(t)||t.status==="blocked")?"blocked":"ready";
function mstats(m){const ts=allT().filter(t=>t.map===m.id),n={active:0,ready:0,blocked:0,done:0};ts.forEach(t=>n[stOf(t)]++);n.fog=m.fog.length;n.total=ts.length;
 n.live=SESS.filter(s=>s.state!=="ended"&&(s.map===m.id||ts.some(t=>t.id===s.ticket))).length;return n}
const mbar=n=>`<span class="mbar" style="width:100%">${[["done","#4d6b57"],["active","#d6b36a"],["ready","#7fbf7a"],["blocked","#a8665a"]].map(([k,c])=>n[k]?`<i style="width:${100*n[k]/(n.total||1)}%;background:${c}"></i>`:"").join("")}</span>`;
const mcode=m=>m.title.split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();
const MCOL=["#7fb0e8","#d79cf2","#8fd58f","#f0c46c"],mcol=m=>MCOL[MAPS.indexOf(m)%4];
const catTip=(n)=>`${n.done} done · ${n.active} in progress · ${n.ready} ready · ${n.blocked} blocked · ${n.fog} fog · ${n.live} live sessions`;
function sIconRaw(state){const [p,c,x]=SPATH[state];return `<span class="ic">${SVG(p,c,x)}</span>`}
const TPATH={
 open:[`<path d="M6 1.5 10.5 6 6 10.5 1.5 6z"/>`,"#7fbf7a","open: not started"],
 claimed:[`<path d="M6 1.5 10.5 6 6 10.5 1.5 6z" fill="#d6b36a"/>`,"#d6b36a","claimed: a session works on it"],
 resolved:[`<path d="M2 6.5 5 9l5-6"/>`,"#707070","resolved"],
 blocked:[`<circle cx="6" cy="6" r="4.2"/><path d="M3 9l6-6"/>`,"#d98a7a","blocked by an unresolved ticket"]};
const tIcon=k=>{const [p,c,t]=TPATH[k];return `<span class="ic"${tip(t)}>${SVG(p,c)}</span>`};
function agoOf(){return ""}
// tooltips

 if(a==="stageAll"||a==="unstageAll"){const f=WT[wtKey(ctx())].files.filter(x=>x[1]);f.forEach(x=>x[2]=a==="stageAll"?1:0);msg=(a==="stageAll"?"Staged ":"Unstaged ")+f.length+" file(s)";return true}
 return false}
// ---- Maps tab: compact, with stats
function mapsA(){const c=ctx();return mapList().map(m=>{const n=mstats(m),sel=c&&c.isMap&&c.m.id===m.id,nx=nextSet().has("map:"+m.id),s=sessM(m.id);
 return `<div class="row grp ${nx?'next':''} ${sel?'sel':''}" data-openmap="${m.id}"${tip(mapTip(m,n))} style="flex-direction:column;align-items:stretch;gap:3px;padding:5px 8px"><div style="display:flex;gap:6px;align-items:center">${nx?STAR:''}<span class="lbl">${esc(m.title)}</span>${s?sIcon(s):''}<span class="dim" style="margin-left:auto">${n.done}/${n.total}</span></div>${mbar(n)}</div>`+
 (sel?`<div class="card"><div class="g"><span${tip("done")}>${tIcon("resolved")} ${n.done}</span><span${tip("in progress")}>${tIcon("claimed")} ${n.active}</span><span${tip("ready")}>${tIcon("open")} ${n.ready}</span><span${tip("blocked")}>${tIcon("blocked")} ${n.blocked}</span><span${tip("fog items")}>${fogIc} ${n.fog}</span><span${tip("live sessions on this map")}>&#9654; ${n.live}</span></div><button class="pri" style="margin-top:6px" data-openmap="${m.id}">&#9654; Continue map</button></div>`:"")}).join("")}
const leftView=w=>w==="maps"?mapsView():w==="sessions"?sessView():treeView();
// ================= right views =================
function buildTree(files){const root={d:{},f:[]};files.forEach(([p,st])=>{const parts=p.split("/");let n=root;parts.slice(0,-1).forEach(d=>{n.d[d]=n.d[d]||{d:{},f:[],ch:false};n=n.d[d];if(st)n.ch=true});n.f.push({name:parts.pop(),st})});return root}
function renderTree(n,depth,path,key){let o="";
 Object.keys(n.d).sort().forEach(d=>{const pp=path+d+"/",k=key+pp,sub=n.d[d],open=dirState[k]===undefined?sub.ch:dirState[k];
  o+=`<div class="tr ${sub.ch?'M':''}" style="padding-left:${6+depth*14}px" data-dir="${k}" data-def="${sub.ch?1:0}"><span class="ch">${open?"&#9662;":"&#9656;"}</span>&#128193; ${esc(d)}${sub.ch?'<span style="margin-left:auto;font-size:9px">&#9679;</span>':''}</div>`;if(open)o+=renderTree(sub,depth+1,pp,key)});
 n.f.sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{o+=`<div class="tr ${f.st}" style="padding-left:${6+depth*14+14}px" data-openfile="${key}${path}${f.name}"><span>&#128196;</span><span>${esc(f.name)}</span>${f.st?`<span style="margin-left:auto;font-weight:700"${tip(f.st==="M"?"Modified":"Untracked/new")}>${f.st==="A"?"U":f.st}</span>`:""}</div>`});return o}
function filesView(){const c=ctx(),w=WT[wtKey(c)];return `<div class="gl dim">${w.newWt?"WORKTREE":"MAIN CHECKOUT"} &middot; <code>${esc(w.branch)}</code></div>${renderTree(buildTree(VS.onlyChanged?w.files.filter(f=>f[1]):w.files),0,"",wtKey(c)+"|")}`}
function gitView(){const c=ctx(),w=WT[wtKey(c)],ch=w.files.filter(f=>f[1]),stg=ch.filter(f=>f[2]),uns=ch.filter(f=>!f[2]);
 const row=f=>{const p=f[0].split("/"),n=p.pop();return `<div class="fr" data-opendiff="${wtKey(c)}|${f[0]}"${tip(f[0]+"\n"+(f[1]==="M"?"Modified":"Untracked/new")+(f[2]?", staged":""))}><span>&#128196;</span><span class="${f[1]}">${esc(n)}</span><span class="dim dir">${esc(p.join("/"))}</span><span class="st ${f[1]}">${f[1]==="A"?"U":f[1]}</span></div>`};
 const lane=l=>l?"#e2c08d":"#4fa6ed";
 const cm=(ch.length?[["*","Uncommitted changes ("+ch.length+")",1,"now"]]:[]).concat(w.commits);
 const graph=cm.map(([h,m,l,ago],i)=>{const nl=cm[i+1]?cm[i+1][2]:l;return `<div class="gl"${tip(h+" "+m+"\n"+ago+(h==="*"?"":" ago"))}><svg width="34" height="24"><line x1="${6+l*14}" y1="12" x2="${6+nl*14}" y2="30" stroke="${lane(l)}" stroke-width="2"/>${i>0?`<line x1="${6+l*14}" y1="0" x2="${6+l*14}" y2="12" stroke="${lane(l)}" stroke-width="2"/>`:""}<circle cx="${6+l*14}" cy="12" r="4" ${h==="*"?`fill="#252526" stroke="${lane(l)}" stroke-width="2"`:`fill="${lane(l)}"`}/></svg><span style="overflow:hidden;text-overflow:ellipsis">${esc(m)}</span><span class="dim" style="margin-left:auto;flex:none">${h==="*"?"":h+" &middot; "}${esc(ago)}</span></div>`}).join("");
 return `<div class="scm"><div class="gl">&#9095; <b>${esc(w.branch)}</b><span class="dim">&uarr;0 &darr;0</span>${c&&c.t?`<span class="pill t-${c.t.type}" style="overflow:hidden;text-overflow:ellipsis"${tip("Linked ticket: "+c.t.title)}>${esc(c.t.title)}</span>`:c&&c.s?'<span class="pill unl">unlinked</span>':'<span class="pill">no ticket</span>'}</div>
 <div style="padding:4px 10px"><textarea rows="2" style="width:100%;resize:none" placeholder="Message (Ctrl+Enter to commit)"></textarea><button class="pri" style="width:100%;margin-top:4px" data-act="toast:Commit (stub)">&#10003; Commit</button></div>
 <div class="grp2"><span>Staged Changes</span><span>${stg.length}</span></div>${stg.map(row).join("")||'<div class="dim" style="padding:2px 10px">none</div>'}
 <div class="grp2"><span>Changes</span><span>${uns.length}</span></div>${uns.map(row).join("")||'<div class="dim" style="padding:2px 10px">none</div>'}
 <div class="grp2"><span>Commits</span><span>${w.commits.length}</span></div>${graph}</div>`}
// ================= editor =================
function whyBox(c){const nx=nextSet();
 if(c.isMap){const m=c.m,f=frontier(m.id),s=sessM(m.id);return nx.has("map:"+m.id)?`<div class="why"><b>&#9733; Why this next?</b><ul>${[[!f.length,"no open, unblocked, unclaimed ticket on the frontier"],[m.fog.length>0,"fog remains ("+m.fog.length+" items): graduate it into tickets"],[!s||s.state==="ended","no live session on this map"]].map(([o,x])=>`<li class="${o?'ok':'no'}">${o?'&#10004;':'&#10008;'} ${x}</li>`).join("")}</ul></div>`:""}
 if(!nx.has(c.t.id))return "";const f=frontier(c.t.map)[0];
 return `<div class="why"><b>&#9733; Why this next?</b><ul>${[[c.t.status==="open","open"],[!blocked(c.t),"all Blocked-by resolved"],[!c.s||c.s.state==="ended","no live session or claim"],[f&&f.id===c.t.id,"first on this map's frontier"]].map(([o,x])=>`<li class="${o?'ok':'no'}">${o?'&#10004;':'&#10008;'} ${x}</li>`).join("")}</ul></div>`}
function header(c,v){const key=c.tab.k+":"+c.tab.i,col=collapsed[key]===undefined?v==="B":collapsed[key],nx=nextSet();
 if(!c.t&&!c.isMap)return `<div class="hdr"><div class="hl"><span class="title">${esc(c.title)}</span><span class="pill unl"${tip("This session is not linked to a ticket or map")}>unlinked</span><span class="chip">${sIcon(c.s)}<span class="dim">${c.s.agent} &middot; ${STXT[c.s.state]}</span></span><span class="dim">${c.s.started}&ndash;${c.s.last} &middot; ${c.s.events} events</span></div></div>`;
 const sess=c.s?`<span class="chip">${sIcon(c.s)}<span class="dim">${c.s.agent}</span></span>`:`<span class="dim"${tip("No terminal yet: pick an agent below")}>no terminal</span>`;
 const isNx=c.isMap?nx.has("map:"+c.m.id):nx.has(c.t.id);
 const chips=c.t?`<span class="pill t-${c.t.type}"${tip("Ticket type: "+c.t.type)}>${c.t.type}</span><span class="chip">${tIcon(blocked(c.t)?"blocked":c.t.status)}<span class="dim">${blocked(c.t)?"blocked":c.t.status}</span></span>${isNx?'<span class="star"'+tip("Next-up candidate")+'>&#9733; next up</span>':''}<span class="pill map-pill"${tip("Map: "+c.m.title)}>${esc(c.m.title)}</span>${sess}`
  :`<span class="pill map-pill">map</span>${isNx?'<span class="star">&#9733; next up</span>':''}<span class="pill map-pill"${tip("Fog of war: decisions not yet specified")}>fog ${c.m.fog.length}</span>${sess}`;
 let body="";
 if(!col){const d=c.t?`<div>${esc(c.t.gist||"")}</div>${c.t.blocked.length?`<div class="bad">blocked by: ${c.t.blocked.map(b=>esc(byId(b).title)).join(", ")}</div>`:""}`:`<div>${esc(c.m.dest)}</div><div style="margin-top:4px"><b>Fog</b>${c.m.fog.map(f=>`<div class="dim">&middot; ${esc(f)}</div>`).join("")}</div>`;
  const why=whyBox(c);body=`<div class="hb ${v==="C"?'cols':''}">${v==="C"?`<div>${d}</div><div>${why||'<span class="dim">not a next-up candidate</span>'}</div>`:d+why}</div>`}
 return `<div class="hdr"><div class="hl"><span class="chev" data-col="${key}">${col?"&#9656;":"&#9662;"}</span><span class="title">${c.isMap?"&#128506; ":""}${esc(c.title)}</span>${chips}</div>${body}</div>`}
function terminal(c){
 if(c.s){const s=c.s,end=s.state==="ended";
  return `<div class="term">${s.log.map(([k,x])=>k==="u"?`<span class="u">&#10095; ${esc(x)}</span>`:k==="a"?`<span class="a">${esc(x)}</span>`:`<span class="t">  &#9679; ${esc(x)}</span>`).join("\n")}${s.typed?`\n<span class="u">&#10095;</span> <span class="ty">${esc(s.typed)}</span><span class="d">_   (pre-typed, NOT submitted &mdash; press Enter)</span>`:""}${end?`\n\n<span class="d">&mdash; session ended, read-only transcript &mdash; </span>`:""}</div>`}
 const cmd=c.t?cmdT(c.t):cmdM(c.m);
 return `<div class="empty"><div class="box"><div style="font-size:15px;color:#fff;margin-bottom:6px">No agent terminal yet</div><div class="dim">Opens a new worktree and a terminal with the recommended command pre-typed (not submitted).</div>
 <div style="margin:12px 0"><label class="dim">Agent CLI&nbsp;</label><select data-agent>${AGENTS.map(a=>`<option ${a===agentSel?'selected':''}>${a}</option>`).join("")}</select></div>
 <div class="mono" style="background:#101010;padding:6px 8px;border-radius:3px;margin-bottom:12px">&#10095; ${esc(cmd)}</div>
 <button class="pri" data-opensession="1">&#9654; Open terminal</button></div></div>`}
function editor(v){const c=ctx();
 const tabIc=t=>{if(t.k==="file")return '<span class="ic dim">&#128196;</span>';if(t.k==="diff")return '<span class="ic warn" style="font-weight:700">&#177;</span>';
  const s=t.k==="ticket"?sessT(t.i):t.k==="session"?SESS.find(x=>x.id===t.i):sessM(t.i);return (t.k==="map"?"&#128506;":"")+(s?sIcon(s):'<span class="ic dim">&#9675;</span>')};
 const tabbar=`<div style="display:flex;background:#2d2d2d;flex:none"><div class="tabs" style="flex:1;min-width:0">${tabs.map((t,i)=>{const nm=tabTitle[t.k](t.i);
  return `<div class="tab ${i===act?'on':''}" data-tabix="${i}"${tip(t.k==="file"||t.k==="diff"?t.i.split("|")[1]+(t.k==="diff"?"\nchanges vs. HEAD":""):nm+(t.k==="session"?"\n(unlinked session)":""))}>${tabIc(t)}<span class="tl">${esc(nm)}</span>${t.k==="session"?'<span class="dim" style="font-size:11px">&#8960;</span>':''}<span class="x" data-closeix="${i}">&times;</span></div>`}).join("")}</div><div style="padding:4px 6px;flex:none">${vmBtn("tabs")}</div></div>`;
 if(!c)return `<div id="ed">${tabbar}<div class="empty"><div class="dim">Select a ticket, map or session</div></div></div>`;
 return `<div id="ed">${tabbar}${c.fileTab?fileHeader(c)+fileBody(c):header(c,v)+terminal(c)}${evPanel(c)}</div>`}
function evPanel(c){if(evMode==="hidden")return "";const s=c.s,l=s&&s.ev.at(-1);
 const hdr=`<div class="evh"><span>Live events ${s?"&middot; "+s.agent+" ":""}</span>${s?sIcon(s):""}${evMode==="line"&&l?`<span class="mono" style="text-transform:none;overflow:hidden;text-overflow:ellipsis"><span class="dim">${l[0]}</span> ${l[1]} ${esc(l[2])}</span>`:""}<span class="sp"></span>${vmBtn("events",true)}<span class="ib" data-ev="${evMode==="full"?"line":"full"}"${tip(evMode==="full"?"Collapse to one line":"Expand")}>${evMode==="full"?"&#9662; line":"&#9652; expand"}</span><span class="ib" data-ev="hidden"${tip("Hide (the status bar keeps an indicator)")}>&times; hide</span></div>`;
 return `<div id="evp">${hdr}${evMode==="full"?`<div class="ev">${s?evs(s).map(([a,b,x])=>`<div><span class="tm">${a}</span> <span class="k">${b}</span> ${esc(x)}</div>`).join(""):'<span class="dim">No agent for this selection.</span>'}</div>`:""}</div>`}
function statusBar(c){const s=c&&c.s,w=WT[wtKey(c)],lv=live().length;
 return `<div id="st"><span class="it" data-act="toggleLeft"${tip("Toggle left side bar")}>&#9776;</span><span${tip("Branch of the selected worktree")}>&#9095; ${esc(w.branch)}</span><span${tip("Uncommitted changes in this worktree")}>${w.files.filter(f=>f[1]).length} changed</span>${c&&c.t?`<span${tip("Selected ticket")}>&#9873; ${esc(c.t.title)}</span>`:""}<span class="sp"></span>
  <span class="it" data-act="cycleEv"${tip("Live events: "+evMode+"\nClick to cycle expanded / one line / hidden"+(s?"\nLast event: "+s.ev.at(-1)[1]+" "+s.ev.at(-1)[2]:""))}>${s?sIcon(s)+" "+esc(s.agent)+" "+STXT[s.state].split(" (")[0]+" &middot; "+esc(s.ev.at(-1)[1]):"no agent"}${evMode==="hidden"?" (events hidden)":""}</span>${msg?`<span>${esc(msg)}</span>`:""}<span${tip("Live sessions / all known sessions of this repo")}>${lv} live / ${SESS.length} sessions</span></div>`}
// ================= variants =================
function VA(){const c=ctx(),L={maps:"Maps",tickets:"Tickets",sessions:"Sessions"};
 const a=`<div id="act">${[["tickets","&#9776;"],["maps","&#128506;"],["sessions","&#9654;"]].map(([k,i])=>`<div class="${leftSel===k&&!leftHidden?'on':''}" data-left="${k}"${tip(L[k])}>${i}${k==="sessions"?`<span class="badge">${live().length}</span>`:""}</div>`).join("")}</div>`;
 const leftActs={tickets:ICB("toast:New ticket","+","New ticket")+ICB("exp","&#8862;","Expand all")+ICB("col","&#8863;","Collapse all"),maps:ICB("toast:New map","+","New map"),sessions:ICB("sgexp","&#8862;","Expand all groups")+ICB("sgcol","&#8863;","Collapse all groups")}[leftSel];
 const rightActs=rightSel==="git"?ICB("toast:Commit (stub)","&#10003;","Commit")+ICB("toast:Refresh","&#10227;","Refresh"):ICB("fcol","&#8863;","Collapse all folders")+ICB("toast:Refresh","&#10227;","Refresh");
 return `${a}${leftHidden?"":`<div class="side" style="width:290px"><div class="sh"><span>${L[leftSel]}</span><span class="acts">${leftActs}${vmBtn(leftSel)}</span></div><div class="body">${leftView(leftSel)}</div></div>`}${editor("A")}
  ${rightHidden?"":`<div class="side" style="width:330px"><div style="display:flex;align-items:center;border-bottom:1px solid #333">${[["files","Explorer"],["git","Source Control"]].map(([k,n])=>`<div class="stab ${rightSel===k?'on':''}" data-right="${k}">${n}${k==="git"?` <span class="pill">${WT[wtKey(c)].files.filter(f=>f[1]).length}</span>`:""}</div>`).join("")}<span class="acts" style="margin-left:auto;padding-right:6px">${rightActs}${vmBtn(rightSel==="git"?"git":"files")}</span></div><div class="body">${rightSel==="git"?gitView():filesView()}</div></div>`}`}
const V={A:["VS Code style (round 6)",VA]},keys=Object.keys(V);
const cur=()=>new URLSearchParams(location.search).get("variant")||"A";
function render(){const v=cur(),c=ctx();hideTip();
 document.getElementById("root").innerHTML=menuBar()+`<div id="main">${V[v][1]()}</div>`+statusBar(c)
  +(modal?`<div id="modal" data-closemodal="1"><div class="m2" onclick="event.stopPropagation()">${modal==="about"?"<h3 style='margin:0 0 6px'>ADE (working name)</h3><div class='dim'>Agent development environment for Matt Pocock skills.<br>Prototype build &mdash; throwaway.</div>":"<h3 style='margin:0 0 6px'>Settings</h3><div class='dim'>Tracker: local-markdown<br>Default agent CLI: "+agentSel+"<br>Auto-submit pre-typed command: off</div>"}<div style="margin-top:12px;text-align:right"><button data-closemodal="1">Close</button></div></div></div>`:"");
 document.getElementById("bar").style.display=keys.length>1?"":"none";document.getElementById("vlabel").textContent=v+" ("+V[v][0]+")";
 document.querySelectorAll(".term,.ev").forEach(e=>e.scrollTop=e.scrollHeight)}
function go(d){const i=(keys.indexOf(cur())+d+keys.length)%keys.length;try{history.replaceState(null,"","?variant="+keys[i])}catch(e){location.search="?variant="+keys[i];return}msg="";render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1)});
function action(a){msg="";if(action2(a))return;
 if(a.startsWith("toast:"))msg=a.slice(6)+" (stub)";
 else if(a.startsWith("ev:"))evMode=a.slice(3);
 else if(a==="about"||a==="settings")modal=a;
 else if(a==="legend")legendOpen=!legendOpen;
 else if(a==="sim"){simOn=!simOn;msg=simOn?"Simulating fog graduated to 3 tickets":"Real data only"}
 else if(a==="closeTab"&&tabs.length){tabs.splice(act,1);act=Math.max(0,act-1)}
 else if(a==="toggleLeft")leftHidden=!leftHidden;
 else if(a==="toggleRight")rightHidden=!rightHidden;
 else if(a==="cycleEv")evMode={full:"line",line:"hidden",hidden:"full"}[evMode];
 else if(a==="next"){go(1);return}
 else if(a==="gotoNext"){const n=[...nextSet()][0];n.startsWith("map:")?openTab("map",n.slice(4)):openTab("ticket",n)}}
document.addEventListener("click",e=>{const q=s=>e.target.closest(s);let x;
 if(x=q("[data-menu]")){menuOpen=menuOpen===x.dataset.menu?null:x.dataset.menu;render();return}
 if(x=q("[data-act]")){action(x.dataset.act);menuOpen=null;render();return}
 if(menuOpen&&!q(".dd")){menuOpen=null;render()}
 if(x=q("[data-closemodal]")){modal=null;render();return}
 if(x=q("[data-closeix]")){const i=+x.dataset.closeix;closed.push(tabs.splice(i,1)[0]);if(act>=i)act=Math.max(0,act-1);render();return}
 if(x=q("[data-tabix]")){act=+x.dataset.tabix;render();return}
 if(x=q("[data-mg]")){mapCollapsed[x.dataset.mg]=!mapCollapsed[x.dataset.mg];render();return}
 if(x=q("[data-openmap]")){openTab("map",x.dataset.openmap);render();return}
 if(x=q("[data-openticket]")){openTab("ticket",x.dataset.openticket);render();return}
 if(x=q("[data-opensess]")){const s=SESS.find(z=>z.id===x.dataset.opensess);s.ticket?openTab("ticket",s.ticket):s.map?openTab("map",s.map):openTab("session",s.id);render();return}
 if(x=q("[data-opensession]")){openSession();render();return}
 if(x=q("[data-col]")){const k=x.dataset.col,def=false;collapsed[k]=!(collapsed[k]===undefined?def:collapsed[k]);render();return}
 if(x=q("[data-left]")){const k=x.dataset.left;if(x.dataset.toggle&&leftSel===k&&!leftHidden)leftHidden=true;else{leftSel=k;leftHidden=false}render();return}
 if(x=q("[data-right]")){const k=x.dataset.right;if(x.dataset.toggle&&rightSel===k&&!rightHidden)rightHidden=true;else{rightSel=k;rightHidden=false}render();return}
 if(x=q("[data-openfile]")){openFile("file",x.dataset.openfile);render();return}
 if(x=q("[data-opendiff]")){openFile("diff",x.dataset.opendiff);render();return}
 if(x=q("[data-sg]")){sessGrp[x.dataset.sg]=!sessGrp[x.dataset.sg];render();return}
 if(x=q("[data-cat]")){const k=x.dataset.cat,cu=catCol[k]===undefined?x.dataset.def==="1":catCol[k];catCol[k]=!cu;render();return}
 if(x=q("[data-flt]")){flt[x.dataset.flt]=flt[x.dataset.flt]?0:1;render();return}
 if(x=q("[data-fog]")){fogOpen[x.dataset.fog]=!fogOpen[x.dataset.fog];render();return}
 if(x=q("[data-dir]")){const k=x.dataset.dir,cu=dirState[k]===undefined?x.dataset.def==="1":dirState[k];dirState[k]=!cu;render();return}
 if(x=q("[data-acc]")){acc[x.dataset.acc]=!acc[x.dataset.acc];render();return}
 if(x=q("[data-ev]")){evMode=x.dataset.ev;render();return}});
document.addEventListener("change",e=>{if(e.target.matches("[data-agent]"))agentSel=e.target.value});
// tooltips: hover any element with data-tip
const tipEl=document.getElementById("tip");
function hideTip(){tipEl.style.display="none"}
document.addEventListener("mouseover",e=>{const x=e.target.closest("[data-tip]");if(!x){hideTip();return}tipEl.textContent=x.dataset.tip;tipEl.style.display="block"});
document.addEventListener("mousemove",e=>{if(tipEl.style.display==="none")return;const w=tipEl.offsetWidth,h=tipEl.offsetHeight;tipEl.style.left=Math.min(e.clientX+14,innerWidth-w-8)+"px";tipEl.style.top=Math.min(e.clientY+16,innerHeight-h-8)+"px"});
render();
</script></body></html>
